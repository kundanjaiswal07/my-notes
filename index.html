<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0e;--bg2:#111116;--bg3:#18181f;
  --border:#23232e;--border2:#2e2e3d;
  --text:#ededf2;--muted:#5a5a72;--faint:#30303d;
  --mono:'DM Mono',monospace;--serif:'Instrument Serif',serif;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:14px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:999;opacity:0.6;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;height:60px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
  background:rgba(11,11,14,0.9);backdrop-filter:blur(16px);
}
.wordmark{
  font-family:var(--serif);font-size:22px;color:var(--text);
  display:flex;align-items:center;gap:10px;
}
.wordmark-icon{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
}
.wordmark-icon svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:1.5}
.header-count{font-size:12px;color:var(--muted)}
.header-count span{color:var(--text);font-weight:500}

/* hero */
.hero{
  padding:5rem 2.5rem 3.5rem;max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:2rem;
  border-bottom:1px solid var(--border);
}
.hero-label{
  font-size:11px;color:var(--muted);letter-spacing:0.14em;
  text-transform:uppercase;margin-bottom:1.25rem;
  display:flex;align-items:center;gap:8px;
}
.hero-label::before{content:'';display:inline-block;width:20px;height:1px;background:var(--muted)}
h1{
  font-family:var(--serif);font-size:clamp(52px,7vw,88px);
  font-weight:400;line-height:0.95;color:var(--text);
  letter-spacing:-0.02em;margin-bottom:1.5rem;
}
h1 em{font-style:italic;color:var(--muted)}
.hero-sub{color:var(--muted);font-size:13px;max-width:400px;line-height:1.8}
.hero-right{text-align:right;padding-bottom:4px}
.hero-stat{
  font-family:var(--serif);font-size:clamp(42px,5vw,64px);
  color:var(--faint);line-height:1;letter-spacing:-0.03em;
}
.hero-stat-label{font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}

/* toolbar */
.toolbar{
  max-width:1100px;margin:0 auto;padding:1.75rem 2.5rem;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.search-wrap{
  flex:1;min-width:220px;
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:0 14px;transition:border-color 0.2s;
}
.search-wrap:focus-within{border-color:var(--border2)}
.search-wrap svg{stroke:var(--muted);flex-shrink:0;fill:none;stroke-width:1.5}
.search-wrap input{
  background:none;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:13px;
  padding:10px 0;width:100%;
}
.search-wrap input::placeholder{color:var(--muted)}
.sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.filter-btn{
  background:none;border:1px solid var(--border);border-radius:4px;
  color:var(--muted);font-family:var(--mono);font-size:12px;
  padding:6px 14px;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{background:var(--text);border-color:var(--text);color:var(--bg)}

/* main */
main{max-width:1100px;margin:0 auto;padding:2.5rem 2.5rem 6rem}
.category-section{margin-bottom:3.5rem;animation:fadeUp 0.4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.category-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:1.25rem;padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.category-icon{
  width:34px;height:34px;border-radius:8px;
  background:var(--bg3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
}
.category-name{font-family:var(--serif);font-size:20px;color:var(--text);font-weight:400}
.category-count{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:0.08em}
.notes-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px;
}
.note-card{
  display:flex;flex-direction:column;gap:8px;
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:1.1rem 1.25rem;text-decoration:none;
  transition:border-color 0.18s,background 0.18s,transform 0.15s;
  position:relative;overflow:hidden;
}
.note-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px)}
.note-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.note-title{font-family:var(--serif);font-size:15px;color:var(--text);line-height:1.35}
.note-arrow{
  color:var(--faint);flex-shrink:0;margin-top:2px;
  transition:color 0.15s,transform 0.15s;
}
.note-card:hover .note-arrow{color:var(--muted);transform:translate(2px,-2px)}
.note-desc{font-size:12px;color:var(--muted);line-height:1.65}
.note-footer{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.note-tags{display:flex;gap:5px;flex-wrap:wrap}
.note-tag{
  font-size:10px;color:var(--muted);
  background:var(--bg);border:1px solid var(--border);
  border-radius:3px;padding:2px 7px;
}
.note-date{font-size:11px;color:var(--faint)}

/* loading / empty / error */
.state-msg{
  text-align:center;color:var(--muted);
  padding:5rem 0;font-size:13px;
}
.state-msg .icon{font-size:32px;margin-bottom:1rem;opacity:0.3}

footer{
  border-top:1px solid var(--border);padding:1.5rem 2.5rem;
  display:flex;align-items:center;justify-content:space-between;
  color:var(--muted);font-size:11px;letter-spacing:0.04em;
}
@media(max-width:640px){
  header,main,.hero,.toolbar,footer{padding-left:1.25rem;padding-right:1.25rem}
  .hero{grid-template-columns:1fr}
  .hero-right{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <div class="wordmark-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    </div>
    The Brain
  </div>
  <div class="header-count"><span id="total-count">—</span> notes</div>
</header>

<div class="hero">
  <div class="hero-left">
    <div class="hero-label">personal knowledge base</div>
    <h1>Every<br/><em>thought,</em><br/>filed.</h1>
    <p class="hero-sub">Notes, references, and things worth keeping — organized by topic, built with Claude, hosted on GitHub.</p>
  </div>
  <div class="hero-right">
    <div class="hero-stat" id="hero-cat-count">—</div>
    <div class="hero-stat-label">categories</div>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="search notes..." autocomplete="off" />
  </div>
  <div class="sep"></div>
  <div id="filters" style="display:flex;gap:8px;flex-wrap:wrap"></div>
</div>

<main id="main">
  <div class="state-msg"><div class="icon">◎</div>loading notes…</div>
</main>

<footer>
  <span>the brain</span>
  <span>hosted on github pages</span>
</footer>

<script>
const CAT_ICONS = {
  "Dev Tools":"🔧","Python":"🐍","Frontend":"🎨","Databases":"🗄️",
  "Linux":"🐧","JavaScript":"⚡","Networking":"🌐","Security":"🔐",
  "CSS":"🎨","React":"⚛️","Git":"🌿","Docker":"🐳","APIs":"🔌",
  "Algorithms":"🧮","System Design":"🏗️","Career":"💼","default":"📄"
};

let NOTES = [];
let activeFilter = "all";
let searchQuery = "";

async function loadNotes() {
  try {
    const res = await fetch("pages.json?nocache=" + Date.now());
    if (!res.ok) throw new Error("pages.json not found");
    NOTES = await res.json();
    init();
  } catch(e) {
    document.getElementById("main").innerHTML = `
      <div class="state-msg">
        <div class="icon">⚠</div>
        <div>Could not load notes.</div>
        <div style="margin-top:8px;font-size:11px">Make sure the GitHub Action has run and <code style="background:var(--bg3);padding:2px 6px;border-radius:3px">pages.json</code> exists in your repo.</div>
      </div>`;
  }
}

function allCategories() {
  return [...new Set(NOTES.map(n => n.category))].sort();
}

function filteredNotes() {
  return NOTES.filter(n => {
    const matchCat = activeFilter === "all" || n.category === activeFilter;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q ||
      n.title.toLowerCase().includes(q) ||
      (n.desc||"").toLowerCase().includes(q) ||
      (n.tags||[]).some(t => t.includes(q)) ||
      n.category.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function buildFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = "";
  const makeBtn = (label, cat) => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === activeFilter ? " active" : "");
    btn.textContent = label;
    btn.dataset.cat = cat;
    el.appendChild(btn);
  };
  makeBtn("all", "all");
  allCategories().forEach(cat => makeBtn(cat.toLowerCase(), cat));
  el.addEventListener("click", e => {
    if (!e.target.matches(".filter-btn")) return;
    activeFilter = e.target.dataset.cat;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    render();
  });
}

function render() {
  const main = document.getElementById("main");
  const notes = filteredNotes();
  document.getElementById("total-count").textContent = NOTES.length;
  document.getElementById("hero-cat-count").textContent = allCategories().length;

  if (!notes.length) {
    main.innerHTML = `<div class="state-msg"><div class="icon">◎</div>no notes match.</div>`;
    return;
  }

  const grouped = {};
  notes.forEach(n => {
    if (!grouped[n.category]) grouped[n.category] = [];
    grouped[n.category].push(n);
  });

  main.innerHTML = "";
  Object.entries(grouped).forEach(([cat, catNotes], i) => {
    const icon = CAT_ICONS[cat] || CAT_ICONS["default"];
    const sec = document.createElement("div");
    sec.className = "category-section";
    sec.style.animationDelay = i * 0.06 + "s";
    sec.innerHTML = `
      <div class="category-header">
        <div class="category-icon">${icon}</div>
        <div class="category-name">${cat}</div>
        <div class="category-count">${catNotes.length} note${catNotes.length !== 1 ? "s" : ""}</div>
      </div>
      <div class="notes-list">
        ${catNotes.map(n => `
          <a class="note-card" href="_notes/${n.file}">
            <div class="note-card-top">
              <div class="note-title">${n.title}</div>
              <svg class="note-arrow" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg>
            </div>
            ${n.desc ? `<div class="note-desc">${n.desc}</div>` : ""}
            <div class="note-footer">
              <div class="note-tags">${(n.tags||[]).map(t=>`<span class="note-tag">${t}</span>`).join("")}</div>
              <span class="note-date">${n.date||""}</span>
            </div>
          </a>`).join("")}
      </div>`;
    main.appendChild(sec);
  });
}

function init() {
  buildFilters();
  render();
  document.getElementById("search").addEventListener("input", e => {
    searchQuery = e.target.value.trim();
    render();
  });
}

loadNotes();
</script>
</body>
</html>
